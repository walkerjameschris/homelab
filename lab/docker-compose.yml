services:

  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ollama-network

  lab:
    build: .
    container_name: lab
    ports:
      - "8888:8888"
      - "8000:8000"
    volumes:
      - ~/Documents:/home/jovyan/
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - UV_LINK_MODE=copy
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - ollama-network

  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    restart: unless-stopped
    hostname: 'gitlab.local'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://treehouse:8080'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
    ports:
      - '8080:8080'
      - '8443:443'
      - '2222:22'
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    networks:
      - ollama-network

volumes:
  ollama-models: {}
  gitlab-config: {}
  gitlab-logs: {}
  gitlab-data: {}

networks:
  ollama-network:
    driver: bridge
